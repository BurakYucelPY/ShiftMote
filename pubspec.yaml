name: shiftmote
description: "IR evrensel kumanda"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Routing
  go_router: ^14.1.1

  # State management
  provider: ^6.1.2

  # Lokalizasyon
  easy_localization: ^3.0.7
  easy_localization_loader: ^2.0.2
  intl: ^0.19.0

  # Tema
  flex_color_scheme: ^7.3.1

  # Lokal DB
  objectbox: ^2.0.0
  objectbox_flutter_libs: ^2.0.0

  # Sistem yolları
  path_provider: ^2.1.2
  path: ^1.8.3

  # IR: pub.dev'de güncel paket yok — Aşama 5'te native MethodChannel köprüsü yazılacak

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  objectbox_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
